# Netlify hosts the Next.js website only.
# Firebase Auth / Firestore / RTDB / Cloud Functions stay on Firebase.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical host: Netlify subdomain → production domain
[[redirects]]
  from = "https://rotaractpulse.netlify.app/*"
  to = "https://pulse.rsamdio.org/:splat"
  status = 301
  force = true
